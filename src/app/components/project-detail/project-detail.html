@if (project(); as p) {
  <div class="page">
    <a class="underlined" routerLink="/projects">Back</a>
    <h2>{{ p.title }}</h2>

    @if (p.header) {
      <img class="moreInfoHeader" [src]="p.header" loading="lazy" />
    }

    <p style="display:inline">{{ p.date }}</p>

    @if (p.links?.length) {
      @for (link of p.links; track link.displayText) {
        <a> | </a>
        <a
          [href]="link.url"
          target="_blank"
          style="display:inline; text-decoration:underline"
        >{{ link.displayText }}</a>
      }
    }

    @if (p.technologies?.length) {
      <a> | </a>
      @for (tech of p.technologies; track tech) {
        <img class="techIcon" [src]="getIcon(tech)" />
      }
    }

    <p [innerHTML]="formattedParagraph()"></p>
  </div>
}
